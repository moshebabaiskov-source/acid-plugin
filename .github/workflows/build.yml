name: Build AcidLine

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: AcidLine-VST3-${{ runner.os }}
          path: build/AcidLine_artefacts/Release/VST3/

      - name: Upload AU (mac)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: AcidLine-AU-macOS
          path: build/AcidLine_artefacts/Release/AU/
